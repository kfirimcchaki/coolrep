# Local / self-hosted shared backend for the GitHub Pages site.
#   docker compose -f deploy/docker-compose.yml up -d --build
# Then open the Pages site → Settings → Backend → Server URL → http://<host>:3000
services:
  nt-scripting:
    build:
      context: ..
      dockerfile: Dockerfile
    image: nt-scripting:latest
    container_name: nt-scripting
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      APP_URL: ${APP_URL:-http://localhost:3000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,https://YOURUSER.github.io}
      SESSION_SECRET: ${SESSION_SECRET:-}
      CONNECT_MOCK: ${CONNECT_MOCK:-1}
      DATA_DIR: /app/.data
    volumes:
      - nt-scripting-data:/app/.data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  nt-scripting-data:
