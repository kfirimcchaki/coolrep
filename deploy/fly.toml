# Fly.io — `fly launch --copy-config --no-deploy` then `fly deploy`.
# Everything the server build needs is already in the Dockerfile.
app = "nt-scripting"
primary_region = "fra"
kill_signal = "SIGINT"
kill_timeout = "5s"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  DATA_DIR = "/data"
  # Set the Pages origin (and any other client) at deploy time:
  #   fly secrets set APP_URL=https://USER.github.io CORS_ORIGINS=https://USER.github.io SESSION_SECRET=$(openssl rand -hex 32)

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[[mounts]]
  source = "nt_scripting_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
