<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NT Scripting</title>
    <meta name="theme-color" content="#08090d" />
    <script>
      /* GitHub Pages serves this document for every unknown path, which is how
         deep links such as /scripts/<uuid> keep their real URL on a static host.
         The SPA below reads location.pathname and renders the matching screen. */
      (function () {
        var repo = 'coolrep';
        var path = window.location.pathname;
        var base = repo && (path === '/' + repo || path.indexOf('/' + repo + '/') === 0) ? '/' + repo : '';
        window.__NT_BASE__ = base;

        var icon = document.createElement('link');
        icon.rel = 'icon';
        icon.type = 'image/svg+xml';
        icon.href = base + '/favicon.svg';
        document.head.appendChild(icon);

        var apple = document.createElement('link');
        apple.rel = 'apple-touch-icon';
        apple.href = base + '/icons/apple-touch-icon.png';
        document.head.appendChild(apple);

        var theme = document.createElement('meta');
        theme.name = 'theme-color';
        theme.content = '#08090d';
        document.head.appendChild(theme);

        var manifest = document.createElement('link');
        manifest.rel = 'manifest';
        manifest.href = base + '/manifest.webmanifest';
        document.head.appendChild(manifest);

        var css = document.createElement('link');
        css.rel = 'stylesheet';
        css.href = base + '/assets/app.css';
        document.head.appendChild(css);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>NT Scripting needs JavaScript enabled to run.</noscript>
    <script>
      (function () {
        var script = document.createElement('script');
        script.src = window.__NT_BASE__ + '/assets/app.js';
        script.async = false;
        document.body.appendChild(script);
      })();
    </script>
  </body>
</html>
